<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARK GPT – Medical Preparation Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    overflow-x: hidden;
}

/* ===== Floating Medical Icons on Left & Right ===== */
.bg-icons-left i, .bg-icons-right i {
    position: fixed;
    color: rgba(255,255,255,0.08);
    animation: float 18s infinite ease-in-out;
    z-index: 1;
}

.bg-icons-left i:nth-child(1) { top: 10%; left: 5%; font-size: 40px; }
.bg-icons-left i:nth-child(2) { top: 40%; left: 2%; font-size: 35px; animation-duration: 22s; }
.bg-icons-left i:nth-child(3) { top: 70%; left: 6%; font-size: 45px; }

.bg-icons-right i:nth-child(1) { top: 20%; right: 5%; font-size: 40px; }
.bg-icons-right i:nth-child(2) { top: 50%; right: 2%; font-size: 38px; animation-duration: 25s; }
.bg-icons-right i:nth-child(3) { top: 75%; right: 6%; font-size: 35px; }

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-35px); }
    100% { transform: translateY(0); }
}

/* ===== App Container ===== */
.app {
    max-width: 900px;
    margin: auto;
    padding: 20px;
    position: relative;
    z-index: 2;
}

/* ===== Header ===== */
.app h1 {
    text-align: center;
    font-size: 2.2rem;
}

.tagline {
    text-align: center;
    opacity: 0.85;
    margin-bottom: 20px;
    font-size: 0.95rem;
}

/* ===== Chat Box ===== */
.chat-box {
    background: rgba(255,255,255,0.08);
    border-radius: 15px;
    padding: 15px;
    height: 65vh;
    overflow-y: auto;
    backdrop-filter: blur(10px);
}

/* Messages */
.user {
    text-align: right;
    margin-bottom: 10px;
    background: #4dd0e1;
    color: #00363a;
    padding: 10px 14px;
    border-radius: 16px 16px 0 16px;
    max-width: 80%;
    margin-left: auto;
}

.bot {
    margin-bottom: 15px;
    background: rgba(255,255,255,0.2);
    padding: 10px 14px;
    border-radius: 16px 16px 16px 0;
    max-width: 80%;
}

.source {
    display: block;
    font-size: 0.75rem;
    opacity: 0.7;
    margin-top: 4px;
}

/* ===== Input Area ===== */
.input-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.input-area input {
    flex: 1;
    padding: 14px;
    border-radius: 30px;
    border: none;
    outline: none;
    font-size: 1rem;
}

.input-area button {
    background: #4dd0e1;
    border: none;
    color: #00363a;
    padding: 0 22px;
    border-radius: 30px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

.input-area button:hover {
    background: #26c6da;
}

/* ===== Footer ===== */
footer {
    text-align: center;
    margin-top: 15px;
    font-size: 0.85rem;
    opacity: 0.8;
}

/* ===== Mobile ===== */
@media(max-width: 600px) {
    .app h1 {
        font-size: 1.6rem;
    }
    .chat-box {
        height: 60vh;
    }
}
</style>
</head>

<body>

<!-- Background Icons on Left -->
<div class="bg-icons-left">
    <i class="fas fa-dna"></i>
    <i class="fas fa-book-medical"></i>
    <i class="fas fa-heartbeat"></i>
</div>

<!-- Background Icons on Right -->
<div class="bg-icons-right">
    <i class="fas fa-stethoscope"></i>
    <i class="fas fa-graduation-cap"></i>
    <i class="fas fa-book-medical"></i>
</div>

<div class="app">
    <h1>JARK GPT</h1>
    <p class="tagline">Medical Preparation Assistant • Fast • Accurate • Intelligent</p>

    <div class="chat-box" id="chatBox">
        <div class="bot">
            👋 Welcome to JARK-GPT! Ask your questions anytime.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="question" placeholder="Ask your questions here..." />
        <button onclick="ask()">Ask</button>
    </div>

    <footer>
        Powered by <strong>JARKTECH</strong> — Empowering dreams through digital innovation
    </footer>
</div>

<script>
async function ask() {
    const input = document.getElementById("question");
    const chatBox = document.getElementById("chatBox");
    const question = input.value.trim();

    if (!question) return;

    chatBox.innerHTML += `<div class="user">${question}</div>`;
    input.value = "";

    chatBox.innerHTML += `<div class="bot">🔍 Thinking...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
    });

    const data = await res.json();

    chatBox.lastElementChild.innerHTML =
        `${data.answer}<span class="source">Source: ${data.source}</span>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
